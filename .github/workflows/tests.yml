name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-scripts

      - name: Run Pint (Code Style Check)
        run: ./vendor/bin/pint --test

  pest:
    name: pest (${{ matrix.database }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - database: mysql
            image: mysql:8.4
            port: 3306
            health-cmd: mysqladmin ping --silent
          - database: pgsql
            image: postgres:17
            port: 5432
            health-cmd: pg_isready -U root -d genealogy_test

    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_DATABASE: genealogy_test
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          POSTGRES_DB: genealogy_test
          POSTGRES_USER: root
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: >-
          --health-cmd="${{ matrix.health-cmd }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-scripts

      - name: Setup environment
        run: cp .env.testing .env

      - name: Run Tests
        run: composer test:ci
        env:
          DB_CONNECTION: ${{ matrix.database }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.port }}
          DB_DATABASE: genealogy_test
          DB_USERNAME: root
          DB_PASSWORD: ""
